name: Publish Docker image

on:
  push:
    tags:
      - "VERSION.*.*.*"

permissions:
  contents: read

env:
  IMAGE_NAME: davorg/artist-site

jobs:
  publish:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Validate the release version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"

          if [[ ! "${tag}" =~ ^VERSION\.([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '${tag}' is not in VERSION.x.y.z format."
            exit 1
          fi

          version="${tag#VERSION.}"
          module_version="$(
            awk '$1 == "our" && $2 == "$VERSION" && $3 == "=" { print $4 }' \
              lib/ArtistSite/Site.pm | tr -d "';"
          )"

          if [[ -z "${module_version}" ]]; then
            echo "::error::Could not read ArtistSite::Site::VERSION."
            exit 1
          fi

          if [[ "${version}" != "${module_version}" ]]; then
            echo "::error::Tag version ${version} does not match ArtistSite::Site version ${module_version}."
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "major_minor=${version%.*}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.major_minor }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
